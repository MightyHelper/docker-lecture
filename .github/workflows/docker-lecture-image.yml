name: Publish Docker lecture image

on:
  push:
    paths:
      - demos/**
      - .github/workflows/docker-lecture-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: v0
            context: demos/v0-fastapi
          - version: v1
            context: demos/v1-compose
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.version }}
            ${{ steps.image.outputs.name }}:${{ matrix.version }}-${{ github.sha }}
